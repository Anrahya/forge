# forge configuration. [roles], [effort], [families] are read by the harness adapter.
# [budgets], [loops], [gates] are read by the gate scripts.

[roles]
# provider/model. The provider id must be one the harness has registered and logged in
# (DSH's built-in DeepSeek adapter is "deepseek-official"). The first "/" splits provider
# from model, so model ids may contain slashes. "inherit" or an empty value means the
# child runs on the parent conversation's model. review takes a list and prefers a
# different family than build; shared blind spots are the point.
ground     = "deepseek-official/deepseek-chat"
scout      = "deepseek-official/deepseek-chat"
shape      = "deepseek-official/deepseek-reasoner"
build      = "deepseek-official/deepseek-chat"
review     = ["openrouter/z-ai/glm-5", "deepseek-official/deepseek-reasoner"]
report     = "deepseek-official/deepseek-chat"
# escalation is never spawned without the human's yes in the conversation.
escalation = "inherit"

[effort]
# reasoning effort ids, applied only when the live route lists that id
shape  = "high"
review = "high"

[families]
# optional; the default family is the leading letters of the model id
glm-5 = "glm"

[budgets]
# added + removed lines in the diff
bug         = 150
feature     = 600
refactor    = 400
chore       = 100
perf        = 600
investigate = 0
research    = 0
prototype   = 0

[loops]
# after this many REVIEW loops with blocking findings open, stop (S4)
review_max = 2

[gates]
# languages with full gate support; others skip with a warning
languages = ["ts", "rust"]
